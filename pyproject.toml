[project]
name = "tomato-bot"
version = "0.1.1"
description = "ポモドーロ・テクニックをDiscordのVCでするためのBot。"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "audioop-lts>=0.2.2",
    "davey>=0.1.6",
    "discord-py>=2.7.1",
    "pathvalidate>=3.3.1",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
